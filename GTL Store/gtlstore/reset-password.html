<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>GTL Store — Reset Password</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .auth-page {
      min-height: calc(100vh - var(--nav-h));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
      background: radial-gradient(circle at top center, var(--brand-ghost) 0%, transparent 60%), var(--bg);
    }
    .auth-card {
      max-width: 440px;
      width: 100%;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow-lg);
    }
    .pw-toggle-btn {
      position: absolute;
      right: .85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-3);
      background: none;
      border: none;
      cursor: pointer;
      padding: .2rem;
      transition: color var(--transition);
      z-index: 2;
    }
    .pw-toggle-btn:hover { color: var(--text); }
    .alert-box {
      padding: .85rem 1rem;
      border-radius: var(--r);
      font-size: .85rem;
      line-height: 1.5;
      margin-bottom: 1.25rem;
    }
    .alert-box--error {
      background: rgba(255, 75, 75, 0.12);
      border: 1px solid rgba(255, 75, 75, 0.3);
      color: #ff8a8a;
    }
    .alert-box--success {
      background: rgba(0, 230, 118, 0.12);
      border: 1px solid rgba(0, 230, 118, 0.3);
      color: #80ffbf;
    }
    .hidden { display: none !important; }
    @media (max-width: 600px) {
      .auth-card { padding: 2rem 1.25rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-logo">GTL<em>.</em></a>
    <div class="nav-center">
      <a href="index.html" class="nav-link">Home</a>
      <a href="index.html#shop" class="nav-link">Shop</a>
      <a href="track-order.html" class="nav-link">Track Order</a>
      <a href="cart.html" class="nav-link">Cart</a>
    </div>
    <div class="nav-right">
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark/light mode" title="Toggle theme">
        <i class="fas fa-moon"></i><span class="theme-toggle-label">Dark</span>
      </button>
      <a href="login.html" class="nav-login-btn nav-login-link" id="nav-login-link">Login</a>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:1.5rem">
        <div class="auth-logo" style="font-size:2rem;margin-bottom:.3rem">GTL<em>.</em></div>
        <p style="font-size:.82rem;color:var(--text-3);letter-spacing:.05em;text-transform:uppercase">Believe In Something Greater</p>
      </div>

      <div id="status-box"></div>

      <div id="reset-loading" class="hidden">
        <p style="text-align:center;color:var(--text-2);padding:1.5rem 0;">Checking your secure password reset link…</p>
      </div>

      <form id="reset-form" class="hidden">
        <h2 style="margin:0 0 1.25rem;text-align:center;font-size:2rem">Create New Password</h2>

        <div class="form-group" style="margin-bottom:1.25rem">
          <label class="form-label" for="new-password">New Password</label>
          <div style="position:relative">
            <input class="form-input" type="password" id="new-password" placeholder="Enter new password" autocomplete="new-password" required style="padding-right:2.75rem"/>
            <button type="button" class="pw-toggle-btn" data-target="new-password" title="Toggle password visibility">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group" style="margin-bottom:1.5rem">
          <label class="form-label" for="confirm-password">Confirm Password</label>
          <div style="position:relative">
            <input class="form-input" type="password" id="confirm-password" placeholder="Confirm new password" autocomplete="new-password" required style="padding-right:2.75rem"/>
            <button type="button" class="pw-toggle-btn" data-target="confirm-password" title="Toggle password visibility">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="update-password-btn">UPDATE PASSWORD</button>
      </form>

      <div id="success-state" class="hidden" style="text-align:center">
        <div class="alert-box alert-box--success" style="margin-bottom:1rem">Your password has been updated successfully.</div>
        <button type="button" class="btn btn-primary btn-full btn-lg" id="go-login-btn">GO TO LOGIN</button>
      </div>

      <div id="error-state" class="hidden" style="text-align:center">
        <div class="alert-box alert-box--error" id="error-message"></div>
        <button type="button" class="btn btn-primary btn-full btn-lg" id="retry-login-btn">GO TO LOGIN</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { auth } from "./js/firebase.js";
    import {
      confirmPasswordReset,
      verifyPasswordResetCode,
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import "./js/app.js";

    const params = new URLSearchParams(window.location.search);
    const oobCode = params.get("oobCode");

    const statusBox = document.getElementById("status-box");
    const resetForm = document.getElementById("reset-form");
    const resetLoading = document.getElementById("reset-loading");
    const successState = document.getElementById("success-state");
    const errorState = document.getElementById("error-state");
    const errorMessage = document.getElementById("error-message");

    const showError = (message) => {
      resetLoading.classList.add("hidden");
      resetForm.classList.add("hidden");
      successState.classList.add("hidden");
      errorState.classList.remove("hidden");
      errorMessage.textContent = message;
    };

    const redirectToLogin = () => {
      window.location.href = "login.html";
    };

    document.getElementById("retry-login-btn")?.addEventListener("click", redirectToLogin);
    document.getElementById("go-login-btn")?.addEventListener("click", redirectToLogin);

    document.querySelectorAll(".pw-toggle-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const targetId = btn.dataset.target;
        const input = document.getElementById(targetId);
        const icon = btn.querySelector("i");
        if (!input || !icon) return;

        if (input.type === "password") {
          input.type = "text";
          icon.className = "fas fa-eye-slash";
        } else {
          input.type = "password";
          icon.className = "fas fa-eye";
        }
      });
    });

    async function initResetFlow() {
      if (!oobCode) {
        showError("This password reset link is invalid or has expired. Please request a new reset link from the GTL login page.");
        return;
      }

      resetLoading.classList.remove("hidden");
      try {
        await verifyPasswordResetCode(auth, oobCode);
        resetLoading.classList.add("hidden");
        resetForm.classList.remove("hidden");
      } catch (err) {
        showError("This password reset link is invalid or has expired. Please request a new reset link from the GTL login page.");
        console.error("Password reset verification failed:", err);
      }
    }

    document.getElementById("reset-form")?.addEventListener("submit", async (event) => {
      event.preventDefault();
      const newPassword = document.getElementById("new-password").value;
      const confirmPassword = document.getElementById("confirm-password").value;
      const alertBox = document.getElementById("status-box");

      alertBox.innerHTML = "";

      if (!newPassword || !confirmPassword) {
        alertBox.innerHTML = `<div class="alert-box alert-box--error">Please fill in both password fields.</div>`;
        return;
      }

      if (newPassword.length < 6) {
        alertBox.innerHTML = `<div class="alert-box alert-box--error">Password must be at least 6 characters long.</div>`;
        return;
      }

      if (newPassword !== confirmPassword) {
        alertBox.innerHTML = `<div class="alert-box alert-box--error">Passwords do not match. Please try again.</div>`;
        return;
      }

      const submitBtn = document.getElementById("update-password-btn");
      if (!submitBtn) return;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span style="display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:.4rem"></span> Updating…';

      try {
        await confirmPasswordReset(auth, oobCode, newPassword);
        resetForm.classList.add("hidden");
        successState.classList.remove("hidden");
        statusBox.innerHTML = "";
      } catch (err) {
        const code = err && err.code ? err.code : "";
        if (code === "auth/weak-password") {
          alertBox.innerHTML = `<div class="alert-box alert-box--error">Password must be at least 6 characters long.</div>`;
        } else if (code === "auth/network-request-failed") {
          alertBox.innerHTML = `<div class="alert-box alert-box--error">Network error. Please check your internet connection and try again.</div>`;
        } else {
          alertBox.innerHTML = `<div class="alert-box alert-box--error">Something went wrong. Please try again.</div>`;
        }
        console.error("Confirm password reset failed:", err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "UPDATE PASSWORD";
      }
    });

    initResetFlow();

    const style = document.createElement("style");
    style.textContent = "@keyframes spin{to{transform:rotate(360deg)}}";
    document.head.appendChild(style);
  </script>
</body>
</html>
