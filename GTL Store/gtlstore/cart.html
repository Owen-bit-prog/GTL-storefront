<!-- ── SCRIPTS ─────────────────────────────────────────────── -->
<script type="module">
  import { auth, db, getCart, saveCart, removeFromCart, updateQty, clearCart, cartTotal, updateCartBadge, showToast, getWishlist, toggleWishlist, addToCart, updateWishlistBadge } from "./js/firebase.js";
  import { onAuthStateChanged }    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import "./js/app.js";

  const root = document.getElementById("cart-root");
  let currentUser = null;

  onAuthStateChanged(auth, user => { currentUser = user; });

  // ── RENDER CART & WISHLIST ───────────────────────────────
  function renderCart() {
    const cart = getCart();
    const wishlist = getWishlist();
    updateCartBadge();
    updateWishlistBadge();

    const wishlistHTML = `
      <div id="wishlist" style="margin-top:4rem;padding-top:2.5rem;border-top:1px solid var(--border)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
          <div>
            <h2 style="font-size:1.5rem;display:flex;align-items:center;gap:.5rem"><i class="fas fa-heart" style="color:#ff4b4b"></i> My Wishlist</h2>
            <p style="color:var(--text-2);font-size:.85rem;margin-top:.2rem">${wishlist.length} saved item${wishlist.length !== 1 ? 's' : ''}</p>
          </div>
        </div>

        ${wishlist.length === 0 ? `
          <div style="background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:2.5rem 1rem;text-align:center;color:var(--text-2)">
            <p>Your wishlist is currently empty. Tap the ❤️ icon on any product to save it for later!</p>
          </div>
        ` : `
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.25rem">
            ${wishlist.map(item => `
              <div style="background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:1rem;display:flex;flex-direction:column;gap:.75rem">
                <img src="${item.imageURL}" alt="${item.name}" style="width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r)"/>
                <div style="flex:1">
                  <p style="font-size:.75rem;color:var(--text-3);text-transform:uppercase">${item.category || 'GTL'}</p>
                  <p style="font-weight:600;font-size:.95rem;margin-top:.1rem">${item.name}</p>
                  <p style="color:var(--brand);font-weight:700;margin-top:.2rem">₵${item.price}</p>
                </div>
                <div style="display:flex;gap:.5rem">
                  <button class="btn btn-primary btn-sm move-to-cart-btn" data-id="${item.id}" data-name="${item.name}" data-price="${item.price}" data-cat="${item.category || ''}" data-img="${item.imageURL}" data-desc="${item.description}" style="flex:1;font-size:.78rem">
                    + Move to Cart
                  </button>
                  <button class="btn btn-outline btn-sm remove-wishlist-btn" data-id="${item.id}" data-name="${item.name}" title="Remove" style="padding:.4rem .6rem">
                    ✕
                  </button>
                </div>
              </div>
            `).join("")}
          </div>
        `}
      </div>
    `;

    if (cart.length === 0) {
      root.innerHTML = `
        <div class="cart-layout" style="display:block">
          <div class="cart-empty" style="padding:4rem 1rem 2rem;text-align:center">
            <div class="cart-empty__icon" style="font-size:3rem;margin-bottom:1rem;color:var(--text-3)"><i class="fas fa-shopping-cart"></i></div>
            <h2>Your cart is empty</h2>
            <p style="color:var(--text-2);margin-top:.4rem">Looks like you haven't added anything yet.</p>
            <a href="index.html#shop" class="btn btn-primary" style="margin-top:1.25rem">Start Shopping</a>
          </div>
          ${wishlistHTML}
        </div>`;
    } else {
      const subtotal  = cartTotal(cart);
      const total     = subtotal;

      root.innerHTML = `
        <div class="cart-layout">
          <!-- Left: items -->
          <div>
            <h1 class="cart-title">My Cart</h1>
            <p class="cart-count">${cart.reduce((s,i)=>s+i.qty,0)} item${cart.reduce((s,i)=>s+i.qty,0)!==1?'s':''}</p>
            <div id="cart-items-list">
              ${cart.map(item => `
                <div class="cart-item" data-id="${item.id}">
                  <img class="cart-item__img" src="${item.imageURL}" alt="${item.name}" loading="lazy"/>
                  <div>
                    <p class="cart-item__cat">${item.category || 'GTL'}</p>
                    <p class="cart-item__name">${item.name}</p>
                    <p class="cart-item__price">₵${item.price}</p>
                    <div class="qty-control" style="margin-top:.6rem">
                      <button class="qty-btn" data-action="minus" data-id="${item.id}" aria-label="Decrease">−</button>
                      <span class="qty-display">${item.qty}</span>
                      <button class="qty-btn" data-action="plus"  data-id="${item.id}" aria-label="Increase">+</button>
                    </div>
                  </div>
                  <div class="cart-item__right">
                    <span class="cart-item__line-total">₵${(item.price * item.qty).toLocaleString()}</span>
                    <button class="cart-remove" data-id="${item.id}" aria-label="Remove item">✕ Remove</button>
                  </div>
                </div>`).join("")}
            </div>
            <div style="margin-top:1.5rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:.75rem">
              <a href="index.html#shop" class="btn btn-outline btn-sm">← Continue Shopping</a>
              <button class="btn btn-dark btn-sm" id="clear-cart-btn">Clear Cart</button>
            </div>
          </div>

          <!-- Right: summary -->
          <aside class="order-summary">
            <h2>Order Summary</h2>
            <div class="summary-row"><span>Subtotal</span><span>₵${subtotal.toLocaleString()}</span></div>
            <div class="summary-total">
              <span>Total</span>
              <span class="summary-total-price">₵${total.toLocaleString()}</span>
            </div>
            <a href="checkout.html" class="btn btn-primary btn-full btn-lg" style="display:inline-flex;width:100%;justify-content:center">
              Proceed to Checkout &rarr;
            </a>
            <p style="font-size:.72rem;color:var(--text-3);text-align:center;margin-top:.75rem">
              🔒 Secure checkout · Orders saved to Firebase
            </p>
          </aside>
        </div>
        ${wishlistHTML}`;
    }

    // Bind events once on root container
  }

  // ── DELEGATED EVENT LISTENERS (ATTACHED ONCE) ──────────────────────────
  root.addEventListener("click", e => {
    // Qty and remove from Cart
    const btn = e.target.closest("[data-id]");
    if (btn) {
      const id = btn.dataset.id;
      if (btn.classList.contains("qty-btn")) {
        const delta = btn.dataset.action === "plus" ? 1 : -1;
        updateQty(id, delta);
        renderCart();
        return;
      }
      if (btn.classList.contains("cart-remove")) {
        removeFromCart(id);
        renderCart();
        showToast("Item removed from cart", "info");
        return;
      }
    }

    // Wishlist events
    const moveBtn = e.target.closest(".move-to-cart-btn");
    if (moveBtn) {
      const product = {
        id: moveBtn.dataset.id,
        name: moveBtn.dataset.name,
        price: Number(moveBtn.dataset.price),
        category: moveBtn.dataset.cat,
        imageURL: moveBtn.dataset.img,
        description: moveBtn.dataset.desc
      };
      addToCart(product);
      toggleWishlist(product); // remove from wishlist after moving to cart
      renderCart();
      return;
    }

    const removeWishBtn = e.target.closest(".remove-wishlist-btn");
    if (removeWishBtn) {
      toggleWishlist({ id: removeWishBtn.dataset.id, name: removeWishBtn.dataset.name });
      renderCart();
      return;
    }

    // Clear cart
    const clearBtn = e.target.closest("#clear-cart-btn");
    if (clearBtn) {
      if (confirm("Clear your entire cart?")) { clearCart(); renderCart(); }
      return;
    }
  });

  // Kick off
  renderCart();
</script>
