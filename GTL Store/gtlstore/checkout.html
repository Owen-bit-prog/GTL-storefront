<!-- ── SCRIPTS ─────────────────────────────────────────────── -->
<script type="module">
  import { auth, db, PAYSTACK_PUBLIC_KEY, getCart, clearCart, cartTotal, updateCartBadge, showToast } from "./js/firebase.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import "./js/app.js";

  const root = document.getElementById("checkout-root");
  let currentUser = null;

  onAuthStateChanged(auth, user => { currentUser = user; renderCheckout(); });

  // ── GENERATE UNIQUE TRANSACTION REFERENCE ──────────────────
  function generateTransactionRef() {
    const timestamp = Date.now().toString().slice(-8);
    const random = Math.random().toString(36).substring(2, 7).toUpperCase();
    return `GTL-${timestamp}-${random}`;
  }

  // ── RENDER CHECKOUT FORM ──────────────────────────────────
  function renderCheckout() {
    const cart = getCart();
    
    if (cart.length === 0) {
      root.innerHTML = `
        <div style="text-align:center;padding:6rem 2rem">
          <h2>Your cart is empty</h2>
          <p style="color:var(--text-2);margin-top:.5rem">Add items to proceed with checkout.</p>
          <a href="index.html#shop" class="btn btn-primary" style="margin-top:1.5rem">Start Shopping</a>
        </div>`;
      return;
    }

    if (!currentUser) {
      const nextPage = encodeURIComponent((window.location.pathname.split('/').pop()) || 'checkout.html');
      root.innerHTML = `
        <div style="text-align:center;padding:6rem 2rem">
          <h2>Login to Checkout</h2>
          <p style="color:var(--text-2);margin-top:.5rem">You must be logged in to complete your purchase.</p>
          <a href="login.html?next=${nextPage}" class="btn btn-primary" style="margin-top:1.5rem">Go to Login</a>
        </div>`;
      return;
    }

    const subtotal = cartTotal(cart);
    const delivery = 0;
    const total = subtotal;

    root.innerHTML = `
      <div class="checkout-container">
        <h1 style="margin-bottom:2.5rem">Checkout</h1>

        <div class="checkout-grid">
          <!-- Left: Form -->
          <div class="checkout-column">
            <div style="background:var(--dark-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:2rem;margin-bottom:2rem">
              <h2 style="font-size:1.2rem;margin-bottom:1.5rem">Shipping Address & Payment</h2>
              
              <form id="checkout-form">
                <div id="checkout-alert"></div>
                <div class="checkout-form-row">
                  <div class="form-group">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-input" name="firstName" placeholder="John" required/>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-input" name="lastName" placeholder="Doe" required/>
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-input" name="email" value="${currentUser.email}" readonly/>
                </div>

                <div class="form-group">
                  <label class="form-label">Phone Number</label>
                  <input type="tel" class="form-input" name="phone" placeholder="+233 24 123 4567" required/>
                </div>

                <div class="checkout-form-row">
                  <div class="form-group">
                    <label class="form-label">City / Location</label>
                    <input type="text" class="form-input" name="city" placeholder="Accra" required/>
                  </div>
                </div>

                <!-- Payment Method Selector -->
                <div class="form-group" style="margin-top: 1.5rem">
                  <label class="form-label" style="font-weight:600;margin-bottom:.75rem;display:block">Select Payment Method</label>
                  
                  <div style="display:flex;flex-direction:column;gap:.75rem">
                    <label class="payment-option" style="display:flex;align-items:center;gap:.75rem;padding:1rem;background:var(--dark-3);border:2px solid var(--brand);border-radius:var(--r);cursor:pointer">
                      <input type="radio" name="paymentMethod" value="paystack" checked style="accent-color:var(--brand);width:18px;height:18px"/>
                      <div style="flex:1">
                        <div style="font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:.5rem">
                          <i class="fas fa-credit-card" style="color:var(--brand)"></i>
                          Paystack Online Payment
                          <span style="font-size:.65rem;background:var(--brand);color:#000;padding:.15rem .4rem;border-radius:4px;font-weight:800;text-transform:uppercase">Instant</span>
                        </div>
                        <div style="font-size:.78rem;color:var(--text-2);margin-top:.25rem">
                          Mobile Money (MTN, Telecel, AT), Visa, Mastercard & Apple Pay
                        </div>
                      </div>
                    </label>

                    <label class="payment-option" style="display:flex;align-items:center;gap:.75rem;padding:1rem;background:var(--dark-3);border:1px solid var(--border);border-radius:var(--r);cursor:pointer">
                      <input type="radio" name="paymentMethod" value="manual" style="accent-color:var(--brand);width:18px;height:18px"/>
                      <div style="flex:1">
                        <div style="font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:.5rem">
                          <i class="fas fa-hand-holding-usd" style="color:var(--text-2)"></i>
                          Pay on Delivery / Direct Transfer
                        </div>
                        <div style="font-size:.78rem;color:var(--text-2);margin-top:.25rem">
                          Pay cash or mobile money upon receiving your package
                        </div>
                      </div>
                    </label>
                  </div>
                </div>

                <div class="form-group" style="margin-top:1.25rem">
                  <label class="form-label">
                    <input type="checkbox" name="terms" style="margin-right:.5rem" required/>
                    I agree to the terms and conditions
                  </label>
                </div>
              </form>
            </div>

            <div style="background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.2);border-radius:var(--r-lg);padding:0.875rem;margin-top:1rem;text-align:left">
              <p style="font-size:.8rem;color:var(--success);line-height:1.5;margin:0;margin-bottom:.5rem;font-weight:600">
                <i class="fas fa-shield-check"></i> Secure Checkout:
              </p>
              <p style="font-size:0.75rem;color:var(--text-2);line-height:1.5;margin:0">
                Online payments are processed securely via Paystack. You will receive an instant confirmation receipt.
              </p>
            </div>

            <div style="background:rgba(244,176,65,.08);border:1px solid rgba(244,176,65,.2);border-radius:var(--r-lg);padding:0.875rem;margin-top:1rem;text-align:center">
              <p style="font-size:0.7rem;color:var(--text-2);line-height:1.5;margin:0">
                Your purchase makes a difference through the GTL Foundation. Every order helps support community empowerment programs in Accra.
              </p>
            </div>
          </div>

          <!-- Right: Order Summary -->
          <aside class="checkout-summary">
            <h2 style="font-size:1.2rem;margin-bottom:1.5rem">Order Summary</h2>
            
            <div class="summary-items">
              ${cart.map(item => `
                <div style="display:flex;gap:.75rem;margin-bottom:1rem;font-size:.9rem">
                  <img src="${item.imageURL}" alt="${item.name}" style="width:60px;height:60px;border-radius:var(--r);object-fit:cover"/>
                  <div style="flex:1">
                    <p style="font-weight:600">${item.name}</p>
                    <p style="color:var(--text-3);font-size:.8rem;margin-top:.2rem">${item.qty}× ₵${item.price}</p>
                  </div>
                  <p style="font-weight:700;color:var(--brand)">₵${(item.price * item.qty).toLocaleString()}</p>
                </div>
              `).join("")}
            </div>

            <div style="display:flex;justify-content:space-between;font-size:.875rem;color:var(--text-2);margin-bottom:.75rem">
              <span>Subtotal</span>
              <span>₵${subtotal.toLocaleString()}</span>
            </div>

            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:2px solid var(--brand)">
              <span style="font-weight:600">Total</span>
              <span style="font-family:var(--font-h);font-size:1.6rem;font-weight:700;color:var(--brand)">₵${total.toLocaleString()}</span>
            </div>

            <button form="checkout-form" type="submit" class="btn btn-primary btn-full btn-lg" id="place-order-btn">
              <i class="fas fa-lock" style="margin-right:.5rem"></i> Pay &amp; Place Order
            </button>

            <a href="cart.html" class="btn btn-outline btn-sm btn-full" style="margin-top:.75rem">← Back to Cart</a>
          </aside>
        </div>
      </div>
    `;

    document.getElementById("checkout-form").addEventListener("submit", handleSubmit);
  }

  // ── DYNAMIC PAYSTACK SCRIPT LOADER ──────────────────────────
  function loadPaystackScript() {
    return new Promise((resolve, reject) => {
      if (window.PaystackPop) return resolve(window.PaystackPop);
      const existing = document.querySelector('script[src*="paystack"]');
      if (existing) {
        let attempts = 0;
        const interval = setInterval(() => {
          attempts++;
          if (window.PaystackPop) {
            clearInterval(interval);
            return resolve(window.PaystackPop);
          }
          if (attempts > 50) {
            clearInterval(interval);
            reject(new Error("Paystack SDK load timed out. Please check your internet connection."));
          }
        }, 100);
        existing.addEventListener('load', () => { clearInterval(interval); resolve(window.PaystackPop); });
        existing.addEventListener('error', () => { clearInterval(interval); reject(new Error("Failed to load Paystack payment SDK.")); });
        return;
      }
      const script = document.createElement("script");
      script.src = "https://js.paystack.co/v1/inline.js";
      script.async = true;
      script.onload = () => resolve(window.PaystackPop);
      script.onerror = () => reject(new Error("Failed to load Paystack payment SDK. Please check your internet connection or disable ad blockers."));
      document.head.appendChild(script);
    });
  }

  async function handleSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById("place-order-btn");
    const alertBox = document.getElementById("checkout-alert");
    if (alertBox) alertBox.innerHTML = "";

    btn.disabled = true;
    const originalHTML = btn.innerHTML;
    btn.innerHTML = `<span style="display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;margin-right:.4rem"></span> Launching Payment…`;

    try {
      const formData = new FormData(e.target);
      const cart = getCart();

      if (!cart || cart.length === 0) {
        throw new Error("Your cart is empty. Please add items before checking out.");
      }

      const selectedMethod = formData.get("paymentMethod") || "paystack";
      const subtotal = cartTotal(cart);
      const delivery = 0;
      const total = subtotal;
      const transactionRef = generateTransactionRef();

      const firstName = (formData.get("firstName") || "").trim();
      const lastName = (formData.get("lastName") || "").trim();
      const phone = (formData.get("phone") || "").trim();
      const city = (formData.get("city") || "").trim();

      if (!firstName || !lastName || !phone || !city) {
        throw new Error("Please complete all required shipping fields.");
      }

      const sanitizedItems = cart.map(i => ({
        productId: String(i.id || ""),
        productName: String(i.name || "Product"),
        price: Number(i.price || 0),
        qty: Number(i.qty || 1),
        lineTotal: Number((i.price || 0) * (i.qty || 1)),
        imageURL: String(i.imageURL || "")
      }));

      if (selectedMethod === "paystack") {
        const paystackKey = (PAYSTACK_PUBLIC_KEY || "").trim();
        if (!paystackKey || !paystackKey.startsWith("pk_")) {
          throw new Error("Invalid Paystack Public Key configured. Please verify your key in js/firebase.js.");
        }

        const PaystackPopSDK = await loadPaystackScript();

        if (!PaystackPopSDK) {
          throw new Error("Paystack payment SDK is not available. Please disable any ad-blockers and try again.");
        }

        const amountPesewas = Math.round(total * 100);

        const handleSuccess = async (responseRef) => {
          try {
            btn.innerHTML = `<span style="display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;margin-right:.4rem"></span> Saving Order…`;
            const finalRef = responseRef || transactionRef;

            const orderRef = await addDoc(collection(db, "orders"), {
              customerName: (currentUser.displayName || `${firstName} ${lastName}`).trim(),
              customerEmail: currentUser.email,
              customerUid: currentUser.uid,
              shippingInfo: { firstName, lastName, phone, city },
              items: sanitizedItems,
              subtotal,
              delivery,
              total,
              status: "paid",
              paymentMethod: "Paystack",
              transactionRef: finalRef,
              paystackReference: finalRef,
              timestamp: serverTimestamp()
            });

            clearCart();
            updateCartBadge();
            sessionStorage.setItem("lastOrderId", orderRef.id);
            sessionStorage.setItem("lastTransactionRef", finalRef);
            sessionStorage.setItem("lastPaymentMethod", "Paystack (Online Payment)");
            sessionStorage.setItem("lastAmount", total.toString());

            showToast("🎉 Payment successful! Order placed.", "success");
            setTimeout(() => {
              window.location.href = `payment-success.html?orderId=${orderRef.id}&reference=${finalRef}&method=Paystack&amount=${total}`;
            }, 600);

          } catch (err) {
            console.error("Order Save Error after Paystack payment:", err);
            const errMsg = "Payment succeeded (Ref: " + responseRef + "), but saving order failed: " + err.message;
            if (alertBox) alertBox.innerHTML = `<div style="background:rgba(255,75,75,.15);border:1px solid var(--danger);color:#ff8a8a;padding:1rem;border-radius:var(--r);margin-bottom:1.5rem;font-size:.9rem">${errMsg}</div>`;
            showToast(errMsg, "error");
            btn.disabled = false;
            btn.innerHTML = originalHTML;
          }
        };

        const handleCancel = () => {
          showToast("Payment popup closed.", "info");
          btn.disabled = false;
          btn.innerHTML = originalHTML;
        };

        if (typeof PaystackPopSDK.setup === "function") {
          const handler = PaystackPopSDK.setup({
            key: paystackKey,
            email: currentUser.email,
            amount: amountPesewas,
            currency: "GHS",
            ref: transactionRef,
            firstname: firstName,
            lastname: lastName,
            phone: phone,
            metadata: {
              custom_fields: [
                { display_name: "Customer Name", variable_name: "customer_name", value: `${firstName} ${lastName}` },
                { display_name: "Phone Number", variable_name: "phone_number", value: phone },
                { display_name: "City", variable_name: "city", value: city }
              ]
            },
            callback: (res) => handleSuccess(res.reference || res.trxref || transactionRef),
            onClose: handleCancel
          });
          handler.openIframe();
        } else {
          const pop = new PaystackPopSDK();
          pop.newTransaction({
            key: paystackKey,
            email: currentUser.email,
            amount: amountPesewas,
            currency: "GHS",
            reference: transactionRef,
            firstName: firstName,
            lastName: lastName,
            phone: phone,
            onSuccess: (res) => handleSuccess(res.reference || transactionRef),
            onCancel: handleCancel
          });
        }

      } else {
        const orderRef = await addDoc(collection(db, "orders"), {
          customerName: (currentUser.displayName || `${firstName} ${lastName}`).trim(),
          customerEmail: currentUser.email,
          customerUid: currentUser.uid,
          shippingInfo: { firstName, lastName, phone, city },
          items: sanitizedItems,
          subtotal,
          delivery,
          total,
          status: "confirmed",
          paymentMethod: "Pay on Delivery",
          transactionRef,
          timestamp: serverTimestamp()
        });

        clearCart();
        updateCartBadge();
        sessionStorage.setItem("lastOrderId", orderRef.id);
        sessionStorage.setItem("lastTransactionRef", transactionRef);
        sessionStorage.setItem("lastPaymentMethod", "Pay on Delivery");
        sessionStorage.setItem("lastAmount", total.toString());

        showToast("🎉 Order placed successfully!", "success");
        setTimeout(() => {
          window.location.href = `payment-success.html?orderId=${orderRef.id}&reference=${transactionRef}&method=Pay%20on%20Delivery&amount=${total}`;
        }, 600);
      }

    } catch (err) {
      console.error("Checkout error:", err);
      const message = err.message === "Cart is empty"
        ? "Your cart is empty. Add items before checking out."
        : err.message || "Error processing checkout. Please try again.";
      showToast(message, "error");
      btn.disabled = false;
      btn.innerHTML = originalHTML;
    }
  }

  // Kick off
  renderCheckout();

  // Add spinAnimation
  const style = document.createElement("style");
  style.textContent = "@keyframes spin{to{transform:rotate(360deg)}}";
  document.head.appendChild(style);
</script>
</body>
